[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rangebranch"
version = "0.1.0a1"
description = "Interpretable decision trees with adaptive multi-range numerical splits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Collin Forbes" },
]
keywords = [
  "machine-learning",
  "decision-tree",
  "interpretable-ai",
  "scikit-learn",
  "multiway-tree",
  "explainable-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.6",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ConnorFord12/rangebranch"
Documentation = "https://github.com/ConnorFord12/rangebranch#readme"
Repository = "https://github.com/ConnorFord12/rangebranch.git"
Issues = "https://github.com/ConnorFord12/rangebranch/issues"
Changelog = "https://github.com/ConnorFord12/rangebranch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
examples = ["pandas>=2.0"]
dev = [
  "build>=1.2",
  "pandas>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rangebranch"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CITATION.cff",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
